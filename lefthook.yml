lefthook: mise exec -- lefthook

pre-commit:
  piped: true
  jobs:
    # Lint fixes come before formatting, so the staged result is formatted.
    - name: lint
      glob: "*.ts"
      run: bun run lint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: types
      glob: "*.ts"
      run: bun check --no-script {staged_files}
    - name: format
      run: bun fmt --ignore-unknown {staged_files}
      stage_fixed: true
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --no-banner --redact

pre-push:
  jobs:
    - name: audit
      script: audit.sh
      runner: sh

post-checkout:
  jobs:
    - name: install
      run: test -d node_modules || bun ci
