name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag
        run: |
          version=$(jq -r .version package.json)
          if [ "$GITHUB_REF" != "refs/tags/v$version" ]; then
            echo "$GITHUB_REF is not refs/tags/v$version, the tag for the version in package.json."
            exit 1
          fi
          if [ "$(git cat-file -t "$GITHUB_REF")" != tag ]; then
            echo "$GITHUB_REF is not an annotated tag, so it has no message for the release notes."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "The tagged commit is not on main."
            exit 1
          fi

  check:
    needs: validate
    permissions:
      contents: read
    # actionlint rejects the `$/` self-repository form; both forms run the caller's commit.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          package-manager-cache: false
      - name: Download tested npm artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/package
      - name: Inspect publication state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-state.ts "$RUNNER_TEMP"/package/*.tgz
      - name: Publish tested npm artifact
        if: steps.state.outputs.npmPublished == 'false'
        working-directory: ${{ runner.temp }}/package
        run: npm publish ./*.tgz --provenance --access public

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: bun
          # This job publishes a GitHub Release, so its tools never come from a cache.
          cache: false
      - name: Download tested npm artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/package
      - name: Inspect publication state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release-state.ts "$RUNNER_TEMP"/package/*.tgz --wait
      - name: Create GitHub Release with tested npm artifact
        if: steps.state.outputs.releaseExists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "$RUNNER_TEMP"/package/*.tgz --verify-tag --notes-from-tag --title "$TAG"
