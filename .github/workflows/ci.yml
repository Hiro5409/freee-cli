name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve freee API schema revisions
        id: freee-api-schema
        env:
          FREEE_SCHEMA_BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$FREEE_SCHEMA_BASE_COMMIT:openapi-ts.config.ts" 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          extract_schema_revision() {
            sed -n 's#.*raw.githubusercontent.com/freee/freee-api-schema/\([0-9a-f]\{40\}\).*#\1#p' | head -n 1
          }

          base_revision=$(git show "$FREEE_SCHEMA_BASE_COMMIT:openapi-ts.config.ts" | extract_schema_revision)
          revision=$(extract_schema_revision < openapi-ts.config.ts)

          if [ -z "$revision" ]; then
            echo "freee API schema must use an immutable commit revision."
            exit 1
          fi

          if [ -z "$base_revision" ] || [ "$base_revision" = "$revision" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "changed=true"
            echo "base=$base_revision"
            echo "revision=$revision"
          } >> "$GITHUB_OUTPUT"

      - name: Check accounting API compatibility
        if: steps.freee-api-schema.outputs.changed == 'true'
        uses: oasdiff/oasdiff-action/breaking@033c15c845bef10f148afb0fa781bf1b2a7fe1bf # v0.1.12
        with:
          base: https://raw.githubusercontent.com/freee/freee-api-schema/${{ steps.freee-api-schema.outputs.base }}/v2020_06_15/open-api-3/api-schema.json
          revision: https://raw.githubusercontent.com/freee/freee-api-schema/${{ steps.freee-api-schema.outputs.revision }}/v2020_06_15/open-api-3/api-schema.json
          fail-on: ERR
          review: false
          github-token: ""

      - name: Check invoice API compatibility
        if: steps.freee-api-schema.outputs.changed == 'true'
        uses: oasdiff/oasdiff-action/breaking@033c15c845bef10f148afb0fa781bf1b2a7fe1bf # v0.1.12
        with:
          base: https://raw.githubusercontent.com/freee/freee-api-schema/${{ steps.freee-api-schema.outputs.base }}/iv/open-api-3/api-schema.yml
          revision: https://raw.githubusercontent.com/freee/freee-api-schema/${{ steps.freee-api-schema.outputs.revision }}/iv/open-api-3/api-schema.yml
          fail-on: ERR
          review: false
          github-token: ""

      - name: Check HR API compatibility
        if: steps.freee-api-schema.outputs.changed == 'true'
        uses: oasdiff/oasdiff-action/breaking@033c15c845bef10f148afb0fa781bf1b2a7fe1bf # v0.1.12
        with:
          base: https://raw.githubusercontent.com/freee/freee-api-schema/${{ steps.freee-api-schema.outputs.base }}/hr/open-api-3/api-schema.json
          revision: https://raw.githubusercontent.com/freee/freee-api-schema/${{ steps.freee-api-schema.outputs.revision }}/hr/open-api-3/api-schema.json
          fail-on: ERR
          review: false
          github-token: ""

      - name: Set up tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Check
        run: bun run check

      - name: Smoke-test installed npm package
        run: |
          package_test_dir=$(mktemp -d)
          npm pack --pack-destination "$package_test_dir"
          cd "$package_test_dir"
          bun init --yes
          bun add ./freee-cli-*.tgz
          ./node_modules/freee-cli/bin/freee --version

      - name: Build standalone executable
        run: bun run build

      - name: Smoke-test standalone executable
        run: ./freee --version

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 秘匿情報の検査は全履歴が対象
          fetch-depth: 0
          persist-credentials: false

      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12

      - name: zizmor
        run: pipx run zizmor==1.25.2 --format plain .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
