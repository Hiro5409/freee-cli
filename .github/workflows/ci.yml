name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --audit-level=high

      # lint / format / knip / typecheck をローカルと同一のコマンドで走らせる。
      # ステップを個別に列挙するとローカルとの二重管理になり、検査の追加漏れを生む
      - name: Check
        run: bun run check

      - name: Test
        run: bun test

      - name: Check npm package
        run: bun run check:package

      - name: Smoke-test installed npm package
        run: |
          package_test_dir=$(mktemp -d)
          npm pack --pack-destination "$package_test_dir"
          cd "$package_test_dir"
          bun init --yes
          bun add ./freee-cli-*.tgz
          ./node_modules/freee-cli/bin/freee --version

      - name: Build standalone executable
        run: bun run build

      - name: Smoke-test standalone executable
        run: ./freee --version

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 秘匿情報の検査は全履歴が対象
          fetch-depth: 0
          persist-credentials: false

      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12

      - name: zizmor
        run: pipx run zizmor==1.25.2 --format plain .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
