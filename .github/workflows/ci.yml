name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check freee API schema pin
        run: |
          if ! git grep -Eq 'raw\.githubusercontent\.com/freee/freee-api-schema/[0-9a-f]{40}' -- openapi-ts.config.ts; then
            echo "freee API schema must use an immutable commit revision."
            exit 1
          fi

      - name: Set up tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Check
        run: bun run check

      - name: Smoke-test installed npm package
        run: |
          package_test_dir=$(mktemp -d)
          npm pack --pack-destination "$package_test_dir"
          cd "$package_test_dir"
          bun init --yes
          bun add ./freee-cli-*.tgz
          ./node_modules/freee-cli/bin/freee --version

      - name: Build standalone executable
        run: bun run build

      - name: Smoke-test standalone executable
        run: ./freee --version

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 秘匿情報の検査は全履歴が対象
          fetch-depth: 0
          persist-credentials: false

      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12

      - name: zizmor
        run: pipx run zizmor==1.25.2 --format plain .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
