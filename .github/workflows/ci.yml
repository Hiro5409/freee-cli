name: CI

on:
  push:
    # A pull request checks its branch, and the Release workflow calls this one for a pushed tag.
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check freee API schema pin
        run: |
          if ! git grep -Eq 'raw\.githubusercontent\.com/freee/freee-api-schema/[0-9a-f]{40}' -- openapi-ts.config.ts; then
            echo "freee API schema must use an immutable commit revision."
            exit 1
          fi

      - name: Set up tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Check
        run: bun run check

      - name: Pack npm artifact
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          bun pm pack --ignore-scripts --destination "$RUNNER_TEMP/package" --quiet

      - name: Smoke-test installed npm artifact
        run: |
          package_test_dir=$(mktemp -d)
          cd "$package_test_dir"
          bun init --yes
          bun add "$RUNNER_TEMP"/package/*.tgz
          ./node_modules/freee-cli/bin/freee --version
          bun -e 'import { withFreeeWeb } from "freee-cli/experimental/web"; if (typeof withFreeeWeb !== "function") throw new Error("Invalid experimental Web export");'

      - name: Build standalone executable
        run: bun run build

      - name: Smoke-test standalone executable
        run: ./freee --version

      - name: Upload npm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 秘匿情報の検査は全履歴が対象
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Gitleaks
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: gitleaks

      - name: Scan git history for secrets
        run: gitleaks git --no-banner --redact

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: zizmor
        run: pipx run zizmor==1.30.1 --format plain .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
